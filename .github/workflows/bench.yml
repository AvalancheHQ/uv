run-name: "${{ inputs.label || 'unzip variants' }}"

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Run name, to tell waves apart"
        type: string
        default: ""
      build-run-id:
        description: "Reuse the benchmark build of this run id (empty: build)"
        type: string
        default: ""
  workflow_call:
    inputs:
      save-rust-cache:
        required: false
        type: string
        default: "true"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1

jobs:
  benchmarks-walltime-build:
    name: "walltime build"
    if: ${{ inputs.build-run-id == '' }}
    runs-on: codspeed-macro-x64-ryzen-9950x-ubuntu-24-04
    timeout-minutes: 60
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: "true"

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"

      - name: "Build benchmarks"
        run: |
          # cargo-codspeed resolves metadata before passing --locked to Cargo.
          cargo metadata --locked --format-version 1 > /dev/null
          uv run --only-dev cargo codspeed build --locked -m walltime --profile profiling -p uv-bench --bench uv

      - name: "Create artifact archive"
        shell: bash
        run: |
          mkdir -p target/codspeed-bin
          cp "$(uv run --only-dev which cargo-codspeed)" target/codspeed-bin/
          tar -cf - target/codspeed target/codspeed-bin | zstd -T0 -3 -o benchmarks-walltime.tar.zst

      - name: "Upload benchmark artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-walltime
          path: benchmarks-walltime.tar.zst
          compression-level: 0
          retention-days: 7

  benchmarks-walltime-run:
    name: "walltime on x86_64 linux"
    runs-on: codspeed-macro-x64-ryzen-9950x-ubuntu-24-04
    needs: benchmarks-walltime-build
    if: ${{ !cancelled() && needs.benchmarks-walltime-build.result != 'failure' }}
    timeout-minutes: 30
    permissions:
      actions: read # to download the build of another run
      contents: read
      id-token: write # for codspeed authentication
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"

      - name: "Download benchmark artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmarks-walltime
          run-id: ${{ inputs.build-run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: "Extract artifact archive"
        shell: bash
        run: zstd -dc benchmarks-walltime.tar.zst | tar -xf -

      - name: "Add codspeed to PATH"
        run: echo "$GITHUB_WORKSPACE/target/codspeed-bin" >> "$GITHUB_PATH"

      - name: "Record CPU frequency settings"
        run: |
          cpu=/sys/devices/system/cpu
          {
            echo "| host | amd_pstate | driver | boost | governor | max freq |"
            echo "| -- | -- | -- | -- | -- | -- |"
            echo "| $(hostname) | $(cat $cpu/amd_pstate/status) | $(cat $cpu/cpu8/cpufreq/scaling_driver) | $(cat $cpu/cpufreq/boost)" \
              "| $(cat $cpu/cpu8/cpufreq/scaling_governor) | $(cat $cpu/cpu8/cpufreq/scaling_max_freq) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "cmdline: $(cat /proc/cmdline)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Record filesystems"
        run: |
          {
            echo "| path | filesystem |"
            echo "| -- | -- |"
            echo "| /tmp | $(findmnt -no FSTYPE -T /tmp) |"
            echo "| crates/uv-bench | $(findmnt -no FSTYPE -T crates/uv-bench) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Retain benchmark profiles"
        id: profiles
        # Only public main pushes produce reusable baseline profiles.
        if: ${{ github.repository == 'astral-sh/uv' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py start "$RUNNER_TEMP/codspeed-walltime" walltime >> "$GITHUB_OUTPUT"

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          run: uv run --only-dev cargo codspeed run --bench uv unzip_wheel_many_files
          mode: walltime
          upload-url: ${{ steps.profiles.outputs.upload-url }}

      # The same benchmark code under other names, in a second process on the same boot.
      - name: "Run benchmarks again"
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          run: uv run --only-dev cargo codspeed run --bench uv unzip_again_wheel_many_files
          mode: walltime
          upload-url: ${{ steps.profiles.outputs.upload-url }}

      - name: "Finish profile capture"
        if: ${{ always() && steps.profiles.outcome == 'success' }}
        run: ./target/debug/uv run --script scripts/codspeed-profiles.py finish "$RUNNER_TEMP/codspeed-walltime"

      - name: "Upload benchmark profiles"
        if: ${{ steps.profiles.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codspeed-profiles-walltime
          path: |
            ${{ runner.temp }}/codspeed-walltime/metadata.json
            ${{ runner.temp }}/codspeed-walltime/profile.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
